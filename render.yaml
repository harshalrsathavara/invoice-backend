services:
  - type: web
    name: invoice-backend
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Invoice Backend
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: APP_KEY
        sync: false # paste output of: php artisan key:generate --show
      - key: APP_URL
        sync: false # e.g. https://invoice-backend.onrender.com
      # Admin panel login, created/updated on every boot (free plan has no shell)
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Mobile number the app signs in with (OTP). Optional.
      - key: ADMIN_PHONE
        sync: false
      # Test mode: the OTP is fixed at 123456 and returned to the app so it
      # can prefill the field. Set to false once SMS delivery exists.
      - key: OTP_DEBUG
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      # Testing: SQLite inside the container (resets on every restart/sleep).
      # For real data switch DB_CONNECTION to mysql and set DB_HOST, DB_PORT,
      # DB_DATABASE, DB_USERNAME, DB_PASSWORD and MYSQL_ATTR_SSL_CA.
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      # Business logos/signatures go to Cloudflare R2 (Render's disk is wiped on redeploy)
      - key: BUSINESS_IMAGES_DISK
        value: r2
      - key: R2_ENDPOINT
        sync: false # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
