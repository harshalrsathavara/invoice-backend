services:
  - type: web
    name: invoice-backend
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Invoice Backend
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: APP_KEY
        sync: false # paste output of: php artisan key:generate --show
      - key: APP_URL
        sync: false # e.g. https://invoice-backend.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # CA bundle for SSL to the MySQL host. System bundle works for TiDB Cloud;
      # for Aiven, add its ca.pem as a Render Secret File and use /etc/secrets/ca.pem
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      # Business logos/signatures go to Cloudflare R2 (Render's disk is wiped on redeploy)
      - key: BUSINESS_IMAGES_DISK
        value: r2
      - key: R2_ENDPOINT
        sync: false # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
